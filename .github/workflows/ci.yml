name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          # Build-time placeholders only — not used for a live deploy
          AUTH_SECRET: ci-build-auth-secret-not-for-production
          WALLET_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DATABASE_URL: postgresql://satspilot:satspilot@127.0.0.1:5432/satspilot?schema=public
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Production audit (omit dev)
        run: npm audit --omit=dev
        continue-on-error: true
